<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Agent - 数据分析助手</title>
<style>
  * {margin:0;padding:0;box-sizing:border-box}
  body {font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f5f5;height:100vh;display:flex}
  /* Sidebar */
  #sidebar {width:260px;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;flex-shrink:0}
  #sidebar h2 {padding:20px 16px 12px;font-size:16px;color:#e94560;border-bottom:1px solid #333}
  #session-list {flex:1;overflow-y:auto;padding:8px}
  .session-item {padding:12px;margin:4px 0;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;transition:background .15s}
  .session-item:hover {background:#2a2a4a}
  .session-item.active {background:#e94560;color:#fff}
  .session-item .name {flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .session-item .count {font-size:11px;opacity:.7;margin-left:8px}
  .session-item .del {opacity:0;transition:opacity .15s;cursor:pointer;margin-left:6px}
  .session-item:hover .del {opacity:.6}
  .session-item .del:hover {opacity:1}
  #new-session {margin:12px;padding:10px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;transition:opacity .15s}
  #new-session:hover {opacity:.85}
  /* Status badge */
  #runtime-badge {padding:8px 16px;font-size:11px;color:#888;text-align:center;border-top:1px solid #333}
  #runtime-badge.ready {color:#4ecca3}
  /* Main */
  #main {flex:1;display:flex;flex-direction:column;min-width:0}
  #header {padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px}
  #header h1 {font-size:16px;font-weight:600}
  #header .session-name {color:#e94560;font-weight:400}
  #chat {flex:1;overflow-y:auto;padding:20px}
  .msg {margin-bottom:16px;max-width:80%;line-height:1.6}
  .msg.user {margin-left:auto;background:#e94560;color:#fff;padding:10px 16px;border-radius:12px 12px 4px 12px}
  .msg.assistant {background:#fff;padding:10px 16px;border-radius:12px 12px 12px 4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .msg.tool {background:#f0f4ff;border-left:3px solid #4e7cff;padding:10px 16px;border-radius:4px 12px 12px 4px;font-size:12px;color:#555;max-width:90%}
  .msg.tool summary {cursor:pointer;font-weight:600;color:#4e7cff}
  .msg.error {background:#fff0f0;border-left:3px solid #e94560;padding:10px 16px;border-radius:4px;color:#a33}
  .msg .tool-calls {margin-top:4px;font-size:12px;color:#4e7cff}
  /* Traces panel */
  #traces-toggle {position:fixed;right:0;top:50%;transform:translateY(-50%);background:#1a1a2e;color:#fff;padding:12px 6px;border-radius:8px 0 0 8px;cursor:pointer;font-size:12px;writing-mode:vertical-rl;z-index:10}
  #traces-panel {position:fixed;right:0;top:0;bottom:0;width:320px;background:#fff;box-shadow:-2px 0 10px rgba(0,0,0,.15);display:none;flex-direction:column;z-index:20}
  #traces-panel.open {display:flex}
  #traces-header {padding:16px;font-weight:600;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between}
  #traces-header button {border:none;background:none;cursor:pointer;font-size:16px}
  #traces-body {flex:1;overflow-y:auto;padding:16px;font-size:12px}
  .trace-item {margin-bottom:12px;padding:10px;background:#f8f8f8;border-radius:8px}
  .trace-item .name {font-weight:600;color:#333}
  .trace-item .meta {color:#888;margin-top:4px}
  .trace-item .args {color:#555;margin-top:4px;word-break:break-all}
  /* Input */
  #input-area {padding:16px 20px;background:#fff;border-top:1px solid #e0e0e0;display:flex;gap:12px}
  #input-area textarea {flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;resize:none;font-size:14px;font-family:inherit;outline:none;min-height:44px;max-height:120px}
  #input-area textarea:focus {border-color:#e94560}
  #input-area button {padding:10px 24px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
  #input-area button:hover {opacity:.85}
  #input-area button:disabled {opacity:.4;cursor:default}
  .loading {display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#e94560;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px}
  @keyframes spin {to{transform:rotate(360deg)}}
  .empty-state {text-align:center;color:#aaa;margin-top:100px}
  .empty-state p {margin:8px 0}
</style>
</head>
<body>

<div id="sidebar">
  <h2>📊 Data Agent</h2>
  <div id="session-list"></div>
  <button id="new-session">+ 新建会话</button>
  <div id="runtime-badge">检测中…</div>
</div>

<div id="main">
  <div id="header">
    <h1>数据分析助手</h1>
    <span class="session-name" id="current-session-name"></span>
  </div>
  <div id="chat">
    <div class="empty-state" id="empty-state">
      <p>👋 选择一个会话或新建一个开始分析</p>
      <p style="font-size:13px">试试问：<br>"帮我看看数据库里有哪些表"<br>"查一下华东区销售额最高的5个产品，画个柱状图"</p>
    </div>
  </div>
  <div id="input-area">
    <textarea id="msg-input" placeholder="输入你的数据分析需求…" rows="1" disabled></textarea>
    <button id="send-btn" disabled>发送</button>
  </div>
</div>

<div id="traces-toggle" onclick="toggleTraces()">工具追踪</div>
<div id="traces-panel">
  <div id="traces-header"><span>🔧 工具调用追踪</span><button onclick="toggleTraces()">✕</button></div>
  <div id="traces-body"><div style="color:#aaa">暂无记录</div></div>
</div>

<script>
const API = '';
let currentSessionId = null;
let tracesVisible = false;

// ── Init ──
fetch(API + '/api/health').then(r => r.json()).then(d => {
  const badge = document.getElementById('runtime-badge');
  badge.textContent = d.runtime_ready ? 'Runtime 已就绪' : 'Runtime 待实现';
  badge.className = d.runtime_ready ? 'ready' : '';
  console.log('Health:', d);
});

refreshSessions();

// ── Sessions ──
async function refreshSessions() {
  const res = await fetch(API + '/api/sessions');
  const sessions = await res.json();
  const list = document.getElementById('session-list');
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${s.session_id === currentSessionId ? 'active' : ''}"
         onclick="selectSession('${s.session_id}')">
      <span class="name">${esc(s.name)}</span>
      <span class="count">${s.message_count}</span>
      <span class="del" onclick="event.stopPropagation();delSession('${s.session_id}')">🗑</span>
    </div>
  `).join('');
}

async function selectSession(sid) {
  currentSessionId = sid;
  await refreshSessions();
  document.getElementById('msg-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.style.display = 'none';
  await loadHistory(sid);
}

async function newSession() {
  const name = prompt('会话名称：') || '';
  const res = await fetch(API + '/api/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  });
  const data = await res.json();
  await selectSession(data.session_id);
}

async function delSession(sid) {
  if (!confirm('删除此会话？')) return;
  await fetch(API + '/api/sessions/' + sid, {method: 'DELETE'});
  if (currentSessionId === sid) {
    currentSessionId = null;
    document.getElementById('chat').innerHTML = '<div class="empty-state" id="empty-state"><p>👋 选择一个会话或新建一个开始分析</p></div>';
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
  }
  refreshSessions();
}

// ── Chat ──
async function loadHistory(sid) {
  const res = await fetch(API + '/api/sessions/' + sid + '/history');
  const msgs = await res.json();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  if (msgs.length === 0) {
    chat.innerHTML = '<div class="empty-state"><p>开始对话吧 🚀</p></div>';
  } else {
    msgs.forEach(m => appendMessage(m));
    chat.scrollTop = chat.scrollHeight;
  }
}

function appendMessage(msg) {
  const chat = document.getElementById('chat');
  const el = document.getElementById('empty-state');
  if (el) el.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + msg.role;
  if (msg.tool_calls) {
    const tools = msg.tool_calls.map(tc => tc.function.name).join(', ');
    div.innerHTML = esc(msg.content || '') + `<div class="tool-calls">🔧 调用: ${esc(tools)}</div>`;
  } else {
    div.textContent = msg.content;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  if (!currentSessionId) return;
  const textarea = document.getElementById('msg-input');
  const message = textarea.value.trim();
  if (!message) return;

  appendMessage({role: 'user', content: message});
  textarea.value = '';
  document.getElementById('send-btn').disabled = true;

  // Show loading
  const chat = document.getElementById('chat');
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg assistant';
  loadingDiv.innerHTML = '<span class="loading"></span>思考中…';
  loadingDiv.id = 'loading-msg';
  chat.appendChild(loadingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch(API + '/api/sessions/' + currentSessionId + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message})
    });
    const data = await res.json();
    document.getElementById('loading-msg').remove();

    if (data.reply) {
      appendMessage({role: 'assistant', content: data.reply});
    }
    if (data.error && !data.reply) {
      appendMessage({role: 'error', content: '❌ ' + data.error});
    }
    if (data.tool_traces && data.tool_traces.length > 0) {
      addTraces(data.tool_traces.data);
      data.tool_traces.forEach(t => appendTraceToChat(t));
    }
  } catch(e) {
    document.getElementById('loading-msg').remove();
    appendMessage({role: 'error', content: '❌ 请求失败: ' + e.message});
  }
  document.getElementById('send-btn').disabled = false;
  refreshSessions();
}

function appendTraceToChat(t) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg tool';
  div.innerHTML = `<summary>🔧 ${esc(t.tool_name)}</summary>参数: ${esc(t.arguments)} | 耗时: ${t.duration_ms}ms | ${esc(t.result_summary)}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ── Traces ──
function toggleTraces() {
  const panel = document.getElementById('traces-panel');
  tracesVisible = !tracesVisible;
  panel.className = tracesVisible ? 'open' : '';
}

function addTraces(traces) {
  const body = document.getElementById('traces-body');
  if (body.querySelector('div[style]')) body.innerHTML = '';
  traces.forEach(t => {
    const div = document.createElement('div');
    div.className = 'trace-item';
    div.innerHTML = `<div class="name">${esc(t.tool_name)}</div>
      <div class="args">参数: ${esc(t.arguments)}</div>
      <div class="meta">${esc(t.result_summary)} | ${t.duration_ms}ms ${t.is_async ? '⚡异步' : ''}</div>`;
    body.prepend(div);
  });
}

// ── Utils ──
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('new-session').onclick = newSession;
document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('msg-input').onkeydown = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
};
</script>
</body>
</html>
